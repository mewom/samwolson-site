<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xinjiang Portraits — Sam Wolson</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta name="description" content="Sam Wolson — Documentary and portrait photographer.">
</head>
<body>
<style>body{background:#fff;color:#111;}</style>
<main class="page-content">
    <div class="gallery-header">
      <a href="../new-yorker.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
      </a>
      <h1>Xinjiang Portraits</h1>
      <p class="gallery-desc">Portraits commissioned by The New Yorker as part of the project ‘Inside Xinjiang’s Prison State’ launched on The New Yorker’s website in early March 2021.</p>
      <p>6 photographs</p>
    </div>

    <div class="photo-strip">
      <div class="photo-item"><img src="../images/xinjiang-portraits/Xin-Wolson-200107-0002.jpg" alt="Xin Wolson 200107 0002" loading="lazy"></div>
      <div class="photo-item"><img src="../images/xinjiang-portraits/Xin-Wolson-200107-0006.jpg" alt="Xin Wolson 200107 0006" loading="lazy"></div>
      <div class="photo-item"><img src="../images/xinjiang-portraits/Xin-Wolson-200107-0009.jpg" alt="Xin Wolson 200107 0009" loading="lazy"></div>
      <div class="photo-item"><img src="../images/xinjiang-portraits/Xin-Wolson-200107-0018-jpeg.jpeg" alt="Xin Wolson 200107 0018 jpeg" loading="lazy"></div>
      <div class="photo-item"><img src="../images/xinjiang-portraits/Xin-Wolson-200107-0022-jpeg.jpeg" alt="Xin Wolson 200107 0022 jpeg" loading="lazy"></div>
      <div class="photo-item"><img src="../images/xinjiang-portraits/brighter-DSC6281-2-jpeg.jpeg" alt="brighter DSC6281 2 jpeg" loading="lazy"></div>
    </div>
  </main>

  <div class="bottom-nav">
    <a href="../new-yorker.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </a>
  </div>

  <footer class="site-footer">
    &copy; 2024 Sam Wolson. All rights reserved.
  </footer>
  
  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-inner">
      <button id="lb-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <button class="lb-btn" id="lb-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <img id="lb-img" src="" alt="" draggable="false"/>
      <button class="lb-btn" id="lb-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <div id="lb-caption"></div>
      <div id="lb-counter"></div>
    </div>
  </div>

  <script src="../js/gallery.js"></script>
  <script src="../js/lightbox.js"></script>
</body>
</html>
