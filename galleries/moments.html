<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moments — Sam Wolson</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta name="description" content="Sam Wolson — Documentary and portrait photographer.">
</head>
<body>
<style>body{background:#fff;color:#111;}</style>
<main class="page-content">
    <div class="gallery-header">
      <a href="../new-yorker.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
      </a>
      <h1>Moments</h1>
      <p class="gallery-desc">A collection of singular moments from assignments around the world.</p>
      <p>9 photographs</p>
    </div>

    <div class="photo-strip">
      <div class="photo-item"><img src="../images/moments/Single-Single-0001.jpg" alt="Single Single 0001" loading="lazy"></div>
      <div class="photo-item"><img src="../images/moments/Single-Single-0002.jpg" alt="Single Single 0002" loading="lazy"></div>
      <div class="photo-item"><img src="../images/moments/Single-Single-0003.jpg" alt="Single Single 0003" loading="lazy"></div>
      <div class="photo-item"><img src="../images/moments/Single-Single-0004.jpg" alt="Single Single 0004" loading="lazy"></div>
      <div class="photo-item"><img src="../images/moments/Single-Single-0005.jpg" alt="Single Single 0005" loading="lazy"></div>
      <div class="photo-item"><img src="../images/moments/Single-Single-0010.jpg" alt="Single Single 0010" loading="lazy"></div>
      <div class="photo-item"><img src="../images/moments/Single-Single-0011.jpg" alt="Single Single 0011" loading="lazy"></div>
      <div class="photo-item"><img src="../images/moments/Single-Single-0012.jpg" alt="Single Single 0012" loading="lazy"></div>
      <div class="photo-item"><img src="../images/moments/Single-Single-0013.jpg" alt="Single Single 0013" loading="lazy"></div>
    </div>
  </main>

  <div class="bottom-nav">
    <a href="../new-yorker.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </a>
  </div>

  <footer class="site-footer">
    &copy; 2024 Sam Wolson. All rights reserved.
  </footer>
  
  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-inner">
      <button id="lb-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <button class="lb-btn" id="lb-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <img id="lb-img" src="" alt="" draggable="false"/>
      <button class="lb-btn" id="lb-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <div id="lb-caption"></div>
      <div id="lb-counter"></div>
    </div>
  </div>

  <script src="../js/gallery.js"></script>
  <script src="../js/lightbox.js"></script>
</body>
</html>
